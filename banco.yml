---
- name: Health Check - Verificar tabelas corrompidas do MariaDB/MySQL
  hosts: all
  gather_facts: false
  become: true
  become_user: root
  ignore_unreachable: yes

  tasks:

    - name: Verificar se mysqlcheck está instalado
      command: which mysqlcheck
      register: mysqlcheck_bin
      changed_when: false
      failed_when: false

    - name: Executar verificação das tabelas
      command: mysqlcheck --all-databases --check --silent
      register: mysqlcheck
      changed_when: false
      failed_when: false
      when: mysqlcheck_bin.rc == 0

    - name: Servidor saudável
      debug:
        msg: |
          ==========================================
          HOST: {{ inventory_hostname }}
          STATUS: OK
          Nenhuma tabela corrompida encontrada.
          ==========================================
      when:
        - mysqlcheck_bin.rc == 0
        - mysqlcheck.rc == 0

    - name: Servidor com problemas
      debug:
        msg: |
          ==========================================
          HOST: {{ inventory_hostname }}
          STATUS: ERRO

          {{ mysqlcheck.stdout }}

          {{ mysqlcheck.stderr }}
          ==========================================
      when:
        - mysqlcheck_bin.rc == 0
        - mysqlcheck.rc != 0

    - name: mysqlcheck não encontrado
      debug:
        msg: |
          ==========================================
          HOST: {{ inventory_hostname }}
          STATUS: AVISO
          mysqlcheck não está instalado.
          ==========================================
      when: mysqlcheck_bin.rc != 0
