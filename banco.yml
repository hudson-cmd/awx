---
- name: Health Check - Verificar Integridade do MariaDB/MySQL
  hosts: all
  gather_facts: false
  become: true
  become_user: root
  ignore_unreachable: true

  vars:
    mysql_user: root
    mysql_password: "{{ mysql_root_password }}"

  tasks:

    - name: Verificar se mysqlcheck está instalado
      command: which mysqlcheck
      register: mysqlcheck_bin
      changed_when: false
      failed_when: false

    - name: Executar Health Check do Banco
      command:
        argv:
          - mysqlcheck
          - "-u{{ mysql_user }}"
          - "-p{{ mysql_password }}"
          - "--all-databases"
          - "--check"
          - "--silent"
      register: mysqlcheck
      changed_when: false
      failed_when: false
      no_log: true
      when: mysqlcheck_bin.rc == 0

    - name: Resultado - Banco OK
      debug:
        msg: |
          ==================================================
          HOST   : {{ inventory_hostname }}
          STATUS : ✅ OK

          Nenhuma tabela corrompida encontrada.
          ==================================================
      when:
        - mysqlcheck_bin.rc == 0
        - mysqlcheck.rc == 0

    - name: Resultado - Banco com Problemas
      debug:
        msg: |
          ==================================================
          HOST   : {{ inventory_hostname }}
          STATUS : ❌ ERRO

          {{ mysqlcheck.stdout }}

          {{ mysqlcheck.stderr }}
          ==================================================
      when:
        - mysqlcheck_bin.rc == 0
        - mysqlcheck.rc != 0

    - name: Resultado - mysqlcheck não instalado
      debug:
        msg: |
          ==================================================
          HOST   : {{ inventory_hostname }}
          STATUS : ⚠️ AVISO

          O utilitário mysqlcheck não está instalado.
          ==================================================
      when: mysqlcheck_bin.rc != 0
